# @package _global_
env_name: puzzle

# === Model ===
d_model: 1024
n_heads: 16
depth: 24

# === Training ===
batch_size: 64               # per GPU, the paper used 4 GPUs
pad_before: 3
pad_after: 3

# === Inference ===
planner_ckpt: ${ckpt_root}/${env_name}/diffusion.ckpt
invdyn_ckpt: ${ckpt_root}/${env_name}/invdyn.ckpt
x_min: -3.3                  # clip range of the Tweedie estimates in the guidance losses of cvp_sample
x_max: 3.3
canon_horizon: 76            # frames in the plan, covered by 6 overlapping chunks of 16 frames
stride: 12                   # a chunk starts every 12 frames, so neighboring chunks share 4
horizon_ctx: [[2, 4], [4, 4], [4, 4], [4, 4], [4, 4], [4, 2]]   # per chunk: number of first and last frames tied to the neighboring chunks, or to the start and goal
wg: 0.8
discount: 0.5
w_sync: 0.5
sync_loss: huber
